<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assembly Process Planner</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">⚙</span> Assembly Process Planner</div>
  <nav class="tabs" id="tabs">
    <button data-tab="plan">Plan</button>
    <button data-tab="recipes">Recipes</button>
    <button data-tab="parts">Parts</button>
    <button data-tab="data">Import / Export</button>
    <button data-tab="settings">Calendar &amp; settings</button>
  </nav>
  <div class="topbar-right">
    <button class="btn btn-ghost" id="btnHelp" title="Help">?</button>
  </div>
</header>

<main id="main">
  <section class="tab" id="tab-plan"></section>
  <section class="tab" id="tab-recipes"></section>
  <section class="tab" id="tab-parts"></section>
  <section class="tab" id="tab-data"></section>
  <section class="tab" id="tab-settings"></section>
</main>

<div id="toasts"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="tooltip" class="tooltip hidden"></div>

<script src="js/util.js"></script>
<script src="js/calendar.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/store.js"></script>
<script src="js/csv-io.js"></script>
<script src="js/ui-common.js"></script>
<script src="js/ui-parts.js"></script>
<script src="js/ui-recipes.js"></script>
<script src="js/ui-plan.js"></script>
<script src="js/ui-data.js"></script>
<script src="js/ui-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
